# Drop-in for lionpick.service — turn the vector-store readiness gate from "report" into "enforce".
#   sudo install -D -m 644 deploy/systemd/lionpick.service.d/05-ready-gate.conf \
#        /etc/systemd/system/lionpick.service.d/05-ready-gate.conf
#   sudo systemctl daemon-reload && sudo systemctl restart lionpick
#
# Before installing: run once with RAG_READY_GATE=report and confirm
#   curl -s http://127.0.0.1:8000/ready | python3 -m json.tool   →  vector_store_gate.ok == true
# (the current Chroma legacy index — schema_version null, 1082 / 145 — is expected to pass).
# With enforce, /ready returns 503 whenever the configured store cannot actually serve a dense
# query; tools/cloud-autodeploy.sh (curl -sf | grep ready) then rolls the deploy back.
[Service]
Environment=RAG_READY_GATE=enforce
