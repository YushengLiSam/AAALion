# Drop-in for lionpick.service — uvicorn 只监听 127.0.0.1(P0.2 收紧暴露面)。
#
# 公网流量只走 Cloudflare quick tunnel(cloudflared tunnel --url http://localhost:8000),它在
# 本机连 localhost:8000,所以绑回环不影响 tunnel;外网直连 <VM IP>:8000 从此连不上。
# 合并即生效(autodeploy 同步本文件 → daemon-reload → restart)。合并前提和验证方法
# (不重启 tunnel)见 docs/RUNBOOK_OPS.md §5:
#   * 确认没有客户端还在直连 IP:8000(iOS Config.swift 指向的是 tunnel URL);
#   * VM 上 `getent ahosts localhost` 确认 localhost 解析到 127.0.0.1
#     (若只解析到 ::1,cloudflared 会连不上只绑 IPv4 的 uvicorn)。
# 之后所有请求的 socket 对端都是 127.0.0.1,真实客户端 IP 只能看 CF-Connecting-IP 头。
#
# ExecStart 不能叠加,必须先写一个空的 ExecStart= 清掉原值;除 --host 外与原 unit 完全相同
# (/etc/systemd/system/lionpick.service,WorkingDirectory=/home/yushengli/AAALion-/server)。
# 回退:删除本文件并提交(autodeploy 会把它从 /etc 移除并 daemon-reload),或者手工
#   sudo rm /etc/systemd/system/lionpick.service.d/30-bind-localhost.conf
#   sudo systemctl daemon-reload && sudo systemctl restart lionpick
[Service]
ExecStart=
ExecStart=/home/yushengli/AAALion-/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
