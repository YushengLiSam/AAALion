# Drop-in for lionpick.service — uvicorn 只监听 127.0.0.1(P0.2 收紧暴露面)。
#
# 公网流量只走 Cloudflare quick tunnel(cloudflared tunnel --url http://localhost:8000),它在
# 本机连 localhost:8000,所以绑回环不影响 tunnel;外网直连 <VM IP>:8000 从此连不上。
# 生效时机:autodeploy 部署一个包含本文件的提交时同步 → daemon-reload → restart。
# **注意自举**:合并引入本文件的那次提交是 VM 上的旧版 autodeploy 部署的,旧版不同步 drop-in;
# 要么手工跑 `bash tools/cloud-autodeploy.sh --resync-dropins`,要么等 main 上的下一个提交。
# 合并前提和验证方法(不重启 tunnel)见 docs/RUNBOOK_OPS.md §5 / §7:
#   * 确认没有客户端还在直连 IP:8000(iOS Config.swift 指向的是 tunnel URL);
#   * VM 上 `getent ahosts localhost` 确认 localhost 解析结果里有 127.0.0.1
#     (cloudflared 是 Go 程序,::1 被拒会回退到 127.0.0.1;只有 ::1 一个结果时才会连不上)。
# 客户端 IP:socket 对端都是 127.0.0.1,而 uvicorn 默认 --proxy-headers + forwarded-allow-ips=127.0.0.1,
# 会把 X-Forwarded-For 里最右边的非 127.0.0.1 地址写进 request.client(访问日志里显示成 "<ip>:0")。
# 按 IP 限流的代码应优先读 CF-Connecting-IP(Cloudflare 边缘设置,客户端伪造不了)。
#
# ExecStart 不能叠加,必须先写一个空的 ExecStart= 清掉原值;除 --host 外与原 unit 完全相同
# (/etc/systemd/system/lionpick.service,WorkingDirectory=/home/yushengli/AAALion-/server)。
# 文件名排序在后的 drop-in(比如 `systemctl edit` 生成的 override.conf)若也写了 ExecStart,会覆盖本文件:
# 上线后用 `systemctl show lionpick -p ExecStart` 确认。
# 回退:删除本文件并提交(autodeploy 会把它从 /etc 移除并 daemon-reload),或者手工
#   sudo rm /etc/systemd/system/lionpick.service.d/30-bind-localhost.conf
#   sudo systemctl daemon-reload && sudo systemctl restart lionpick
[Service]
ExecStart=
ExecStart=/home/yushengli/AAALion-/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
