# Drop-in for lionpick.service — 演示 / 鉴权模式开关。
#
# DEMO_MODE=0(2026-10-07 机主决定:生产关闭):验证码(dev_code)不再随响应返回;
#   没有真实短信网关,所以手机号验证码登录 / 找回密码会返回"短信服务未配置",
#   密码登录与 Apple 登录不受影响。需要现场演示手机号登录时,临时改成 1 并提交,演示后改回 ——
#   =1 时知道手机号 / 邮箱就能登录对应账号(越权校验对这类账号形同虚设),见 docs/SECURITY.md。
# AUTH_ENFORCE_MODE=report:鉴权 / 越权校验只记录不拦截(先观察误伤,再切 enforce)。
#   已核对(合并安全代码时):report 只作用于新加的越权校验(偏好 / 降价提醒 / 复购 / 拼单 / me / migrate);
#   原来就强制 JWT 的删号接口(auth._require_session)不受这个开关影响,仍然一直拦截。
#   切 enforce 的前提:iOS 带 JWT 的新版本已经装到用户手机上(否则登录用户这些功能会 401)。
[Service]
Environment=DEMO_MODE=0
Environment=AUTH_ENFORCE_MODE=report
