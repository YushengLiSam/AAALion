# Drop-in for lionpick.service — 演示 / 鉴权模式开关。
#
# DEMO_MODE=1:验证码(dev_code)仍随响应返回,方便没有短信网关时演示手机号登录。
#   **归属未定**(PLAN.md §7 第 11 项):这台 VM 现在既是"生产"又是"演示机",生产要不要关
#   dev_code 需要机主拍板。决定之前保持现状(=1,行为与今天一致);确定关闭时把这一行改成
#   DEMO_MODE=0 并提交即可(autodeploy 同步 + 重启)。
# AUTH_ENFORCE_MODE=report:鉴权 / 越权校验只记录不拦截(先观察误伤,再切 enforce)。
# 这两个变量由安全相关的代码读取;代码还没读它们时,设置了也没有任何效果。
[Service]
Environment=DEMO_MODE=1
Environment=AUTH_ENFORCE_MODE=report
