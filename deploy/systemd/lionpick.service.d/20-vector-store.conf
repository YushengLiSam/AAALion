# Drop-in for lionpick.service — 向量库选择(P1 线上切换后的生产值,2026-10-07)。
# 由 tools/cloud-autodeploy.sh 自动同步到 /etc/systemd/system/lionpick.service.d/(install -m 644
# + daemon-reload);部署失败回滚时随上一个版本一起退回。改这里 = 一次提交 = 一次部署。
#
#   RAG_STORE=milvus              主库:Milvus Standalone(10-milvus.conf 读凭据并在启动前等 healthz)
#   RAG_STORE_SHADOW=chroma       反向影子:后台对比 Chroma 结果
#   RAG_STORE_FALLBACK=chroma     Milvus 查询失败时退到 Chroma …
#   RAG_STORE_FALLBACK_UNTIL      … 只到这一天为止(到期前决定是否延长)
#   RAG_CHROMA_DIR                兜底 / 影子用的 schema v2 Chroma 副本(相对仓库根)
# 写在 systemd 的 Environment= 里(而不是 server/.env),这样 10-milvus.conf 的 ExecStartPre
# 也能看到 RAG_STORE=milvus。回滚到 Chroma 见 docs/RUNBOOK_MILVUS.md。
[Service]
Environment=RAG_STORE=milvus
Environment=RAG_STORE_SHADOW=chroma
Environment=RAG_STORE_FALLBACK=chroma
Environment=RAG_STORE_FALLBACK_UNTIL=2026-10-21
Environment=RAG_CHROMA_DIR=data/.chroma_v2
