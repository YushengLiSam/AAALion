# Drop-in for lionpick.service — Milvus Standalone runs in Docker on the same VM.
#   sudo install -D -m 644 deploy/systemd/lionpick.service.d/10-milvus.conf \
#        /etc/systemd/system/lionpick.service.d/10-milvus.conf
#   sudo systemctl daemon-reload
#
# Installing this file does NOT switch the vector store: RAG_STORE stays whatever the
# unit / prod env says (chroma today). The cutover is its own one-line change
# (RAG_STORE=milvus), see docs/RUNBOOK_MILVUS.md.
[Unit]
# Boot order: docker → (containers restart: unless-stopped) → lionpick.
After=docker.service
Wants=docker.service

[Service]
# Milvus credentials for the API process only (lionpick_app, read-only). Mode 600, owner root:
#   RAG_MILVUS_URI=http://127.0.0.1:19530
#   RAG_MILVUS_TOKEN=lionpick_app:<password>
# The leading "-" keeps the unit startable while the file does not exist yet (Chroma mode).
EnvironmentFile=-/etc/lionpick/milvus.secret.env
# When serving from Milvus, wait (bounded, ~80 s) for the container's /healthz before starting,
# so warmup does not run against a Milvus that is still booting after a reboot. Never fails the
# start: if Milvus is still down, the readiness gate (RAG_READY_GATE=enforce) keeps /ready at 503
# and the autodeploy/uptime check see it. No-op unless RAG_STORE=milvus.
# ("$$" is a literal "$" for the shell — systemd would otherwise expand $VAR itself.)
ExecStartPre=/bin/sh -c '[ "$${RAG_STORE:-}" = "milvus" ] || exit 0; i=0; while [ "$$i" -lt 40 ]; do curl -sf http://127.0.0.1:9091/healthz >/dev/null && exit 0; i=$$((i+1)); sleep 2; done; echo "milvus not healthy after 80s; starting anyway" >&2; exit 0'
