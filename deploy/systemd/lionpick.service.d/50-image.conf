# Drop-in for lionpick.service — 拍照找货开关。
#
# IMAGE_TEXT_PATH_PHOTO_ONLY=0(2026-10-07):没有描述性文字的拍照请求(只发照片 / "这是什么" /
#   "不要这个牌子"这类只带约束的)不跑文字路,卡片与级联完全相同。
#   VM 实测(docs/bench/image_two_path_eval_vm-20261007-sample.json,30 张图 × 1 个变体):
#   文字路让只发照片的融合环节 p50 / p95 从 0.8 ms / 1.2 ms 变成 1.5 s / 6.5 s,"这是什么"变成 1.6 s / 2.5 s,
#   超出首字 p95 ≤ 3 s 的目标(docs/SLO.md);而本机评测里这类请求的第 1 名不变、前 3 名还略降。
#   带描述性文字的请求、SKU 规格问答、照片锚点关系问法不受影响(仍走两路)。
#   回到默认:删掉下面这行并提交。
[Service]
Environment=IMAGE_TEXT_PATH_PHOTO_ONLY=0
