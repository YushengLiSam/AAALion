# 向量库是进程内 Chroma(数据在 ../data/.chroma,随 volume 挂载);Milvus 见 deploy/milvus/。
# 历史上这里还有一个从未被代码使用的 qdrant 服务,P0.9 已删除。
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.rag
    command: ["bash", "-lc", "cd /app/server && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/server
      RAG_PREWARM: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ../data:/app/data
